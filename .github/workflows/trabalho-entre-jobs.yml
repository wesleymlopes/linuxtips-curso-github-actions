name: Trabalho entre Jobs

on:
  push:
    branchs:
      - main
jobs:
  entre-jobs_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versão do ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Estou fazendo o curso de Github" > mensagem.
        
      - uses: actions/upload-artifact@v4
        with:
          name: strigus
          path: mensagem.txt

  entre-jobs_2:
    runs-on: ubuntu-latest
    steps:
      - name: Ver conteudo do diretorio
        run: ls -lha
        
      - uses: actions/download-artifact@v4
        with:
          name: strigus
          path: mensagem.txt

      - name: Ver conteudo do diretorio
        run: ls -lha strigus

      - name: Acessando Arquivo
        run: cat strigus/mensagem.txt