name: Primeiro desafio Linuxtips

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Colocar nome da imagem docker'
        required: true
        type: string

jobs:
  Docker_image:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: recebendo name image docker
        run: docker pull ${{ inputs.image_name}}

      - name: listando imagens
        run: | 
          IMAGE_NAME=$(echo "${{ inputs.image_name}}" | cut -d ':' -f 1)
          docker image ls | grep $IMAGE_NAME

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          image: ${{inputs.image_name}}